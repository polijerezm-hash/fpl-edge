services:
  - type: web
    name: fpl-edge
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_REGION
        value: us
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
