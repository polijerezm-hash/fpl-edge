services:
  - type: web
    name: fpl-edge
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
